<!-- @dsCard group="Components" viewport="700x300" name="NavLink + StatCard" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0}</style>
</head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" data-presets="react">
const { NavLink, StatCard } = window.JWL;
function Demo() {
  return (
    <div style={{display:'flex', flexDirection:'column', gap:24, fontFamily:'var(--font-grotesque)'}}>
      <div style={{background:'var(--surface-page)', padding:20, display:'flex', gap:28}}>
        <NavLink state="default">Valuations</NavLink>
        <NavLink state="hover">Sectors</NavLink>
        <NavLink state="current">Approach</NavLink>
      </div>
      <div style={{background:'var(--surface-ink)', padding:20, display:'flex', gap:40}}>
        <StatCard value="1,400+" label="Valuations issued" onDark />
        <StatCard value="26" label="Counties covered" onDark />
        <StatCard value="5 days" label="Typical turnaround" onDark />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
