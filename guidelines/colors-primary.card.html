<!-- @dsCard group="Colors" viewport="700x160" subtitle="Ink navy, brass, paper, charcoal — no pure black/white, nothing in the agency red/green/magenta field" name="Primary Palette" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;font-family:var(--font-grotesque)">
<div style="display:flex;height:160px">
  <div style="flex:1;background:var(--ink-navy);color:var(--paper);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font:var(--text-body-sm)">Ink Navy<br>#12233C</div>
  <div style="flex:1;background:var(--brass);color:var(--ink-navy);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font:var(--text-body-sm)">Brass<br>#B08A4A</div>
  <div style="flex:1;background:var(--paper);color:var(--ink-navy);border:1px solid var(--hairline);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font:var(--text-body-sm)">Paper<br>#FAF7F1</div>
  <div style="flex:1;background:var(--charcoal);color:var(--paper);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font:var(--text-body-sm)">Charcoal<br>#3A3833</div>
</div>
</body></html>
