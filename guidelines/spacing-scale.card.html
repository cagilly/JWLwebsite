<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--surface-page);padding:16px;font-family:var(--font-grotesque)">

  <div style="width:24px;height:8px;background:var(--ink-navy)"></div>
  <div style="width:24px;height:16px;background:var(--ink-navy)"></div>
  <div style="width:24px;height:24px;background:var(--ink-navy)"></div>
  <div style="width:24px;height:32px;background:var(--ink-navy)"></div>
  <div style="width:24px;height:48px;background:var(--ink-navy)"></div>
  <div style="width:24px;height:64px;background:var(--ink-navy)"></div>
  <div style="width:24px;height:96px;background:var(--ink-navy)"></div>
</div>
<div style="display:flex;gap:8px;margin-top:6px;font:var(--text-eyebrow);color:var(--text-muted)">
  <div style="width:24px">4</div><div style="width:24px">8</div><div style="width:24px">12</div>
  <div style="width:24px">16</div><div style="width:24px">24</div><div style="width:24px">32</div>
  <div style="width:24px">48</div><div style="width:24px">64</div>
