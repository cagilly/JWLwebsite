<!-- @dsCard group="Colors" viewport="700x140" subtitle="Derived tints for hover/press/hairline states — all mixed in oklch, never new hues" name="Tints & Hairlines" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;font-family:var(--font-grotesque);background:var(--surface-page)">
<div style="display:flex;gap:10px;padding:16px;flex-wrap:wrap">
  <div style="width:120px;height:90px;background:var(--ink-navy-90);color:#fff;font:var(--text-eyebrow);padding:8px">ink-navy-90<br>(hover fill)</div>
  <div style="width:120px;height:90px;background:var(--ink-navy-10);color:var(--ink-navy);font:var(--text-eyebrow);padding:8px;border:1px solid var(--hairline)">ink-navy-10<br>(subtle tint)</div>
  <div style="width:120px;height:90px;background:var(--brass-dim);color:var(--paper);font:var(--text-eyebrow);padding:8px">brass-dim</div>
  <div style="width:120px;height:90px;background:var(--hairline);color:var(--ink-navy);font:var(--text-eyebrow);padding:8px">hairline<br>(border)</div>
  <div style="width:120px;height:90px;background:var(--charcoal-60);color:var(--paper);font:var(--text-eyebrow);padding:8px">charcoal-60<br>(muted text)</div>
</div>
</body></html>
