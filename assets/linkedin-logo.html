<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;padding:0}</style>
</head>
<body>
<div style="width:300px;height:300px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;box-sizing:border-box">
  <span style="font:600 62px/1 var(--font-serif);letter-spacing:var(--tracking-wordmark)"><span style="color:var(--ink-navy)">JW</span><span style="color:var(--brass)">L</span></span>
  <div style="position:relative;width:150px;height:11px">
    <div style="position:absolute;left:0;right:0;top:0;height:2.5px;background:var(--ink-navy)"></div>
    <div style="position:absolute;left:0%;top:2.5px;width:1.5px;height:8px;background:var(--charcoal-60);transform:translateX(-50%)"></div>
    <div style="position:absolute;left:12.5%;top:2.5px;width:1.5px;height:8px;background:var(--charcoal-60);transform:translateX(-50%)"></div>
    <div style="position:absolute;left:25%;top:2.5px;width:1.5px;height:8px;background:var(--charcoal-60);transform:translateX(-50%)"></div>
    <div style="position:absolute;left:37.5%;top:2.5px;width:1.5px;height:8px;background:var(--charcoal-60);transform:translateX(-50%)"></div>
    <div style="position:absolute;left:50%;top:2.5px;width:1.5px;height:8px;background:var(--charcoal-60);transform:translateX(-50%)"></div>
    <div style="position:absolute;left:62.5%;top:2.5px;width:1.5px;height:8px;background:var(--charcoal-60);transform:translateX(-50%)"></div>
    <div style="position:absolute;left:75%;top:2.5px;width:1.5px;height:8px;background:var(--charcoal-60);transform:translateX(-50%)"></div>
    <div style="position:absolute;left:87.5%;top:2.5px;width:1.5px;height:8px;background:var(--charcoal-60);transform:translateX(-50%)"></div>
    <div style="position:absolute;left:100%;top:2.5px;width:1.5px;height:8px;background:var(--charcoal-60);transform:translateX(-50%)"></div>
  </div>
  <span style="font:var(--text-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-muted)">Independent Property Valuers</span>
</div>
</body></html>
