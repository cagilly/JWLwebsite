<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;padding:0}</style>
</head>
<body>
<div style="width:1584px;height:396px;background:var(--paper);display:flex;align-items:center;justify-content:center;box-sizing:border-box;font-family:var(--font-grotesque)">
  <div style="display:flex;flex-direction:column;align-items:center;gap:18px">
    <span style="font:600 74px/1 var(--font-serif);letter-spacing:var(--tracking-wordmark)"><span style="color:var(--ink-navy)">JW</span><span style="color:var(--brass)">L</span></span>
    <div style="position:relative;width:190px;height:13px">
      <div style="position:absolute;left:0;right:0;top:0;height:3px;background:var(--ink-navy)"></div>
      <div style="position:absolute;left:0%;top:3px;width:2px;height:10px;background:var(--charcoal-60);transform:translateX(-50%)"></div>
      <div style="position:absolute;left:12.5%;top:3px;width:2px;height:10px;background:var(--charcoal-60);transform:translateX(-50%)"></div>
      <div style="position:absolute;left:25%;top:3px;width:2px;height:10px;background:var(--charcoal-60);transform:translateX(-50%)"></div>
      <div style="position:absolute;left:37.5%;top:3px;width:2px;height:10px;background:var(--charcoal-60);transform:translateX(-50%)"></div>
      <div style="position:absolute;left:50%;top:3px;width:2px;height:10px;background:var(--charcoal-60);transform:translateX(-50%)"></div>
      <div style="position:absolute;left:62.5%;top:3px;width:2px;height:10px;background:var(--charcoal-60);transform:translateX(-50%)"></div>
      <div style="position:absolute;left:75%;top:3px;width:2px;height:10px;background:var(--charcoal-60);transform:translateX(-50%)"></div>
      <div style="position:absolute;left:87.5%;top:3px;width:2px;height:10px;background:var(--charcoal-60);transform:translateX(-50%)"></div>
      <div style="position:absolute;left:100%;top:3px;width:2px;height:10px;background:var(--charcoal-60);transform:translateX(-50%)"></div>
    </div>
    <span style="font:var(--text-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-muted)">Independent Property Valuers</span>
  </div>
</div>
</body></html>
